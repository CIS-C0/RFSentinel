org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8
# Faster builds: reuse task outputs across builds (even after a clean), run independent tasks at once,
# and skip re-running the build scripts when nothing they read changed.
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
