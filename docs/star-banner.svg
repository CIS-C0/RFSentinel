<svg xmlns="http://www.w3.org/2000/svg" width="720" height="96" viewBox="0 0 720 96" role="img" aria-label="Like RF Sentinel? Give it a star on GitHub">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#14071F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FFB000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00F0D8" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Cut-corner panel -->
  <path d="M12 0 H708 L720 12 V84 L708 96 H12 L0 84 V12 Z" fill="url(#bg)"/>
  <path d="M12 0 H708 L720 12 V84 L708 96 H12 L0 84 V12 Z" fill="url(#scan)"/>
  <path d="M12 1 H707 L719 13 V83 L707 95 H13 L1 83 V13 Z" fill="none" stroke="#00F0D8" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Star with RGB split -->
  <g transform="translate(60 48)">
    <path transform="translate(-2 0)" d="M0 -30 L8.8 -12.1 L28.5 -9.3 L14.3 4.6 L17.6 24.3 L0 15 L-17.6 24.3 L-14.3 4.6 L-28.5 -9.3 L-8.8 -12.1 Z" fill="#00F0D8" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="-2 0;-4 1;-2 0;-2 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path transform="translate(2 0)" d="M0 -30 L8.8 -12.1 L28.5 -9.3 L14.3 4.6 L17.6 24.3 L0 15 L-17.6 24.3 L-14.3 4.6 L-28.5 -9.3 L-8.8 -12.1 Z" fill="#FF2E88" opacity="0.7">
      <animateTransform attributeName="transform" type="translate" values="2 0;4 -1;2 0;2 0" dur="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M0 -30 L8.8 -12.1 L28.5 -9.3 L14.3 4.6 L17.6 24.3 L0 15 L-17.6 24.3 L-14.3 4.6 L-28.5 -9.3 L-8.8 -12.1 Z" fill="url(#gold)" filter="url(#glow)"/>
  </g>

  <!-- Text -->
  <text x="112" y="42" font-family="'Share Tech Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="24" font-weight="bold" fill="#EFFFFC">Like RF Sentinel? <tspan fill="#FFD23F">Give it a star!</tspan></text>
  <text x="112" y="70" font-family="'Share Tech Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#7FB8B0">&gt; it's free, takes one click and helps others find it_</text>

  <!-- Sticker -->
  <g transform="translate(640 48) rotate(-8)">
    <rect x="-44" y="-14" width="88" height="28" fill="#F5E100"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Share Tech Mono', Consolas, monospace" font-size="15" font-weight="bold" fill="#050505">&#9733; STAR</text>
  </g>
</svg>
