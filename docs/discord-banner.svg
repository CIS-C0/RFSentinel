<svg xmlns="http://www.w3.org/2000/svg" width="720" height="96" viewBox="0 0 720 96" role="img" aria-label="Join the RF Sentinel Discord">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="1" stop-color="#0D0F2B"/>
    </linearGradient>
    <linearGradient id="blurple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8A94FF"/>
      <stop offset="1" stop-color="#5865F2"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="3" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#5865F2" opacity="0.08"/>
    </pattern>
    <path id="clyde" d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.211.375-.445.865-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.618-1.25.077.077 0 0 0-.079-.037A19.74 19.74 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.319 13.58.099 18.058a.082.082 0 0 0 .031.056 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.873-1.295 1.226-1.994a.076.076 0 0 0-.042-.106 13.1 13.1 0 0 1-1.872-.892.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .078-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .079.009c.12.099.246.198.373.292a.077.077 0 0 1-.007.128 12.3 12.3 0 0 1-1.873.891.077.077 0 0 0-.041.107c.36.698.772 1.363 1.225 1.993a.076.076 0 0 0 .084.029 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.055c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.029ZM8.02 15.331c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.419 0 1.333-.956 2.419-2.157 2.419Zm7.975 0c-1.183 0-2.157-1.086-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.095 2.157 2.419 0 1.333-.946 2.419-2.157 2.419Z"/>
  </defs>

  <!-- Cut-corner panel -->
  <path d="M12 0 H708 L720 12 V84 L708 96 H12 L0 84 V12 Z" fill="url(#bg)"/>
  <path d="M12 0 H708 L720 12 V84 L708 96 H12 L0 84 V12 Z" fill="url(#scan)"/>
  <path d="M12 1 H707 L719 13 V83 L707 95 H13 L1 83 V13 Z" fill="none" stroke="#5865F2" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Discord logo with RGB split -->
  <g transform="translate(32 21) scale(2.25)">
    <use href="#clyde" fill="#00F0D8" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="-0.9 0;-1.8 0.4;-0.9 0;-0.9 0" dur="2.6s" repeatCount="indefinite"/>
    </use>
    <use href="#clyde" fill="#FF2E88" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" values="0.9 0;1.8 -0.4;0.9 0;0.9 0" dur="2.6s" repeatCount="indefinite"/>
    </use>
    <use href="#clyde" fill="url(#blurple)" filter="url(#glow)"/>
  </g>

  <!-- Text -->
  <text x="112" y="42" font-family="'Share Tech Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="24" font-weight="bold" fill="#EFFFFC">Join the <tspan fill="#8A94FF">RF Sentinel Discord</tspan></text>
  <text x="112" y="70" font-family="'Share Tech Mono', 'DejaVu Sans Mono', Consolas, monospace" font-size="15" fill="#8A93C8">&gt; help, ideas, new signatures, ESP32 builds_</text>

  <!-- Live dot + sticker -->
  <g transform="translate(640 48) rotate(-8)">
    <rect x="-46" y="-14" width="92" height="28" fill="#5865F2"/>
    <circle cx="-30" cy="0" r="5" fill="#3BA55D">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <text x="8" y="6" text-anchor="middle" font-family="'Share Tech Mono', Consolas, monospace" font-size="15" font-weight="bold" fill="#FFFFFF">JOIN</text>
  </g>
</svg>
